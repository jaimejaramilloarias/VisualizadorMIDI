extends: ./desktop/electron-builder.common.yml
electronVersion: 43.2.0
directories:
  output: release/desktop/mac-universal
  buildResources: desktop/resources
mac:
  appId: com.jaimejaramilloarias.midistage
  category: public.app-category.music
  icon: desktop/resources/icon.svg
  minimumSystemVersion: 12.0.0
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/resources/entitlements.mac.plist
  entitlementsInherit: desktop/resources/entitlements.mac.plist
  artifactName: MIDI-Stage-V2-${version}-macOS-Universal-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
dmg:
  title: MIDI Stage V2 ${version}
  iconSize: 96
  contents:
    - x: 150
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications
